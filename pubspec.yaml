name: fit_app
description: "Aplicación multiplataforma de entrenamiento, nutrición, hábitos y bienestar."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  http: ^1.2.0
  csv: ^8.0.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  fl_chart: ^1.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  table_calendar: ^3.1.3
  intl: ^0.20.2
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  firebase_app_check: ^0.4.9

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
  assets:
    - assets/data/usda_foundation_2026_10.json
    - assets/images/nutrition/
    - assets/images/workout/training_hero.png
    - assets/images/workout/session_strength.webp
    - assets/images/workout/equipment_detail.webp
    - assets/images/workout/routine_builder.webp
    - assets/images/workout/
    - assets/images/workout/exercises/
